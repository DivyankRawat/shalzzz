<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:#000;
    color:#fff;
    font-family:'Space Mono',monospace;
    min-height:100vh;
    overflow:hidden;
    position:relative;
  }

  /* ---------------- intro counter ---------------- */
  .intro{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
  }
  .intro-num{
    font-family:'Archivo Black',sans-serif;
    font-size:clamp(5rem, 26vw, 16rem);
    line-height:1;
    letter-spacing:-0.02em;
    will-change:transform, opacity, filter;
    display:inline-flex;
    font-variant-numeric:tabular-nums;
  }
  .od-col{
    position:relative;
    height:1em;
    overflow:hidden;
    display:inline-block;
  }
  .od-strip{
    display:flex;
    flex-direction:column;
    will-change:transform, filter;
  }
  .od-digit{
    height:1em;
    line-height:1;
    display:block;
    text-align:center;
  }
  .intro-label{
    position:absolute;
    bottom:8vh;
    left:50%;
    transform:translateX(-50%);
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#666;
  }

  /* ---------------- hero ---------------- */
  .hero{
    position:relative;
    z-index:1;
    min-height:100vh;
    opacity:0;
  }

  .watermark-btn{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    background:none;
    border:none;
    padding:2vh 4vw;
    cursor:pointer;
    z-index:4;
    -webkit-tap-highlight-color:transparent;
  }
  .watermark-btn:focus-visible{outline:2px solid #444; outline-offset:10px; border-radius:8px;}
  .watermark{
    font-family:'Archivo Black',sans-serif;
    font-size:clamp(10rem, 46vw, 34rem);
    line-height:1;
    color:#fff;
    opacity:0.045;
    user-select:none;
    white-space:nowrap;
    transition:opacity 0.3s ease;
    display:block;
  }
  .watermark-btn:hover .watermark{opacity:0.075;}
  .watermark.is-revealed,
  .watermark-btn:hover .watermark.is-revealed{
    opacity:1;
    color:#fff;
  }

  .press-prompt{
    position:absolute;
    top:calc(50% + 9vh);
    left:50%;
    transform:translateX(-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#777;
    z-index:5;
    opacity:0;
    pointer-events:none;
  }
  .press-prompt .ring{
    width:10px;
    height:10px;
    border-radius:50%;
    border:1px solid #555;
    animation:ring-pulse 1.8s ease-in-out infinite;
  }
  @keyframes ring-pulse{
    0%,100%{transform:scale(1); opacity:0.5;}
    50%{transform:scale(1.7); opacity:0;}
  }

  .corner{
    position:absolute;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:#666;
    z-index:5;
  }
  .corner.br{
    bottom:22px; right:24px;
    text-align:right;
    font-variant-numeric:tabular-nums;
    color:#999;
  }

  /* ---------------- heart reveal ---------------- */
  .heart-canvas{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:16;
    pointer-events:none;
  }

  /* ---------------- "happy birthday", floating up behind the number ---------------- */
  .hb-layer{
    position:fixed;
    inset:0;
    z-index:0;               /* below .hero (z-index:1), so the number occludes it */
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    pointer-events:none;
  }
  .hb-stack{
    display:flex;
    flex-direction:column;
    align-items:center;
    line-height:0.82;
    opacity:0;               /* faded to 0.4 by GSAP once the number is revealed */
    text-align:center;
    white-space:nowrap;
  }
  .hb-line{
    font-family:'Archivo Black',sans-serif;  /* same face as the number */
    font-weight:400;
    font-size:100px;         /* replaced at reveal, once the line can be measured */
    letter-spacing:-0.02em;
    /* hollow letters: the fill is dropped and only the edge is drawn */
    color:transparent;
    /* proportional to the type, but never thinner than a visible hairline -
       on a phone the fitted size drops far enough to lose the outline */
    -webkit-text-stroke-width:max(1.7px, 0.014em);
    -webkit-text-stroke-color:#fff;
    /* text-shadow would fill the hollow, since it is cast from the glyph shape
       rather than what is painted; drop-shadow works off the rendered stroke */
    animation:hb-glow 3.6s ease-in-out infinite alternate;
  }
  .hb-line.accent{
    -webkit-text-stroke-color:#ffb7ce;
    animation-name:hb-glow-accent;
  }
  @keyframes hb-glow{
    from{filter:drop-shadow(0 0 6px rgba(255,255,255,0.45)) drop-shadow(0 0 20px rgba(255,255,255,0.22));}
    to{filter:drop-shadow(0 0 14px rgba(255,255,255,0.8)) drop-shadow(0 0 42px rgba(255,255,255,0.45));}
  }
  @keyframes hb-glow-accent{
    from{filter:drop-shadow(0 0 6px rgba(255,183,206,0.5)) drop-shadow(0 0 20px rgba(244,128,159,0.25));}
    to{filter:drop-shadow(0 0 15px rgba(255,183,206,0.85)) drop-shadow(0 0 44px rgba(244,128,159,0.5));}
  }

  .reveal-flash{
    position:absolute;
    top:50%; left:50%;
    width:40px; height:40px;
    transform:translate(-50%,-50%) scale(0);
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,244,248,0.98) 0%, rgba(255,160,190,0.65) 35%, rgba(244,128,159,0.25) 60%, transparent 78%);
    opacity:0;
    pointer-events:none;
    z-index:3;
  }

  /* ---------------- spotify-style mini player ---------------- */
  .player{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%) translateY(120%);
    z-index:25;
    display:flex;
    align-items:center;
    gap:14px;
    width:min(340px, calc(100vw - 32px));
    padding:14px;
    background:rgba(18,18,18,0.86);
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:18px;
    box-shadow:0 10px 32px rgba(0,0,0,0.5);
    transition:transform 0.6s cubic-bezier(.16,1,.3,1), opacity 0.6s ease;
    opacity:0;
  }
  .player.is-visible{
    transform:translateX(-50%) translateY(0);
    opacity:1;
  }
  .player-art{
    position:relative;
    flex-shrink:0;
    width:52px;
    height:52px;
    border-radius:11px;
    overflow:hidden;
    background:#151515;
  }
  .player-art img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transition:opacity 1s ease;
  }
  .player-art img.is-active{
    opacity:1;
  }
  .player-info{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .player-title{
    font-size:13px;
    font-weight:700;
    color:#fff;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .player-artist{
    font-size:10px;
    color:#888;
    letter-spacing:0.03em;
    text-transform:uppercase;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .player-progress{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:2px;
  }
  .player-time{
    font-size:9px;
    color:#6b6b6b;
    font-variant-numeric:tabular-nums;
    flex-shrink:0;
    width:26px;
  }
  .player-time.dur{text-align:right;}
  .player-seek{
    flex:1;
    appearance:none;
    -webkit-appearance:none;
    height:3px;
    border-radius:2px;
    background:linear-gradient(to right, #fff var(--progress, 0%), rgba(255,255,255,0.16) var(--progress, 0%));
    outline:none;
    cursor:pointer;
  }
  .player-seek::-webkit-slider-thumb{
    -webkit-appearance:none;
    appearance:none;
    width:10px;
    height:10px;
    border-radius:50%;
    background:#fff;
    opacity:0;
    transition:opacity 0.15s ease;
  }
  .player-seek:hover::-webkit-slider-thumb,
  .player-seek:active::-webkit-slider-thumb{opacity:1;}
  .player-seek::-moz-range-thumb{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#fff;
    border:none;
    opacity:0;
    transition:opacity 0.15s ease;
  }
  .player-seek:hover::-moz-range-thumb,
  .player-seek:active::-moz-range-thumb{opacity:1;}
  .player-btn{
    flex-shrink:0;
    width:36px;
    height:36px;
    border-radius:50%;
    background:#fff;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform 0.15s ease;
  }
  .player-btn:hover{transform:scale(1.06);}
  .player-btn:active{transform:scale(0.94);}
  .player-btn svg{width:15px; height:15px;}
  .player-btn #pauseIcon{display:none;}
  .player.is-playing .player-btn #playIcon{display:none;}
  .player.is-playing .player-btn #pauseIcon{display:block;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }
</style>
</head>
<body>

  <audio
  id="bgMusic"
  loop
  playsinline
  preload="auto"
>
  <source src="/sounds/pipi-song.mp3" type="audio/mpeg">
</audio>

<div class="intro" id="intro">
  <div class="intro-num" id="introNum">0</div>
  <div class="intro-label">counting the years</div>
</div>

<div class="hero" id="hero">
  <button class="watermark-btn" id="triggerBtn" aria-label="Press to reveal your age">
    <span class="watermark" id="watermark">00</span>
    <span class="reveal-flash" id="revealFlash"></span>
  </button>

  <!-- <div class="press-prompt" id="pressPrompt">
    <span class="ring"></span>
    <span>press to release</span>
  </div> -->

  <span class="corner br" id="liveReadout">—</span>
</div>

<canvas class="heart-canvas" id="heartCanvas"></canvas>
<div class="hb-layer" aria-hidden="true">
  <div class="hb-stack" id="hbStack">
    <span class="hb-line">HAPPY</span>
    <span class="hb-line accent">BIRTHDAY</span>
  </div>
</div>

<!-- ---------------- spotify-style mini player ---------------- -->
<div class="player" id="musicPlayer">
  <div class="player-art">
    <img id="artA" class="is-active" src="/ref/girl.jpeg" alt="">
    <img id="artB" src="/ref/girl2.jpeg" alt="">
  </div>
  <div class="player-info">
    <div class="player-title">Sweety Song</div>
    <div class="player-artist">Birthday Playlist</div>
    <div class="player-progress">
      <span class="player-time" id="curTime">0:00</span>
      <input type="range" id="seek" class="player-seek" min="0" max="100" value="0" step="0.1" aria-label="Seek">
      <span class="player-time dur" id="durTime">0:00</span>
    </div>
  </div>
  <button class="player-btn" id="playPauseBtn" aria-label="Play or pause song">
    <svg id="playIcon" viewBox="0 0 24 24" fill="#000"><path d="M8 5v14l11-7z"/></svg>
    <svg id="pauseIcon" viewBox="0 0 24 24" fill="#000"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
  </button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  // ---- EDIT THIS: real birth date/time, given in IST (India Standard Time) ----
  // 14:30 IST on Aug 2, 2003 == 09:00 UTC on Aug 2, 2003  (birth year set so the reveal lands on 23)
  const IST_OFFSET_MS = (5 * 60 + 30) * 60000;
  // const BIRTH_UTC_MS = Date.UTC(2003, 7, 2, 9, 0, 0);
  const BIRTH_UTC_MS = Date.UTC(1999, 7, 4, 18, 30, 0);
  const shiftedBirth = new Date(BIRTH_UTC_MS + IST_OFFSET_MS); // read with getUTC* for IST wall-clock parts

  function computeParts(){
    // shift "now" into the same IST-wall-clock domain so getUTC* reads IST time
    // regardless of the viewer's own device timezone
    const shiftedNow = new Date(Date.now() + IST_OFFSET_MS);

    const by = shiftedBirth.getUTCFullYear();
    const bmo = shiftedBirth.getUTCMonth();
    const bda = shiftedBirth.getUTCDate();
    const bhh = shiftedBirth.getUTCHours();
    const bmi = shiftedBirth.getUTCMinutes();
    const bse = shiftedBirth.getUTCSeconds();

    let years = shiftedNow.getUTCFullYear() - by;
    let annivMs = Date.UTC(shiftedNow.getUTCFullYear(), bmo, bda, bhh, bmi, bse);
    if(shiftedNow.getTime() < annivMs){
      years--;
      annivMs = Date.UTC(shiftedNow.getUTCFullYear() - 1, bmo, bda, bhh, bmi, bse);
    }

    const sinceAnniv = shiftedNow.getTime() - annivMs;
    const totalSec = Math.floor(sinceAnniv / 1000);
    return {
      years,
      days: Math.floor(totalSec / 86400),
      hours: Math.floor((totalSec % 86400) / 3600),
      minutes: Math.floor((totalSec % 3600) / 60),
      seconds: totalSec % 60
    };
  }

  const initial = computeParts();
  const AGE = initial.years - 1;
  const DISPLAY_AGE = Math.max(0, AGE - 1);

  document.getElementById('watermark').textContent = String(DISPLAY_AGE).padStart(2,'0');

  // declared here (not further down) so the very first readout() call below
  // can safely reference it
  let revealed = false;

  function readout(p){
    // before the burn reveal, the watermark intentionally shows one year
    // less (DISPLAY_AGE) as part of the reveal effect - the ticker must
    // match that number, or it looks like the clock is wrong
    const shownYears = revealed ? p.years : DISPLAY_AGE;
    return `${shownYears}y · ${p.days}d · ${String(p.hours).padStart(2,'0')}:${String(p.minutes).padStart(2,'0')}:${String(p.seconds).padStart(2,'0')}`;
  }
  document.getElementById('liveReadout').textContent = readout(initial);

  // ---------------- press-to-release trigger ----------------
  const triggerBtn = document.getElementById('triggerBtn');
  const watermarkEl = document.getElementById('watermark');
  const revealFlash = document.getElementById('revealFlash');
  const hbStack = document.getElementById('hbStack');
  const heartCanvas = document.getElementById('heartCanvas');
  let transitioning = false;
  let celebrated = false;

 

  // ---------------- celebration ----------------

  // Both words are stretched to the full width independently, so the pair
  // fills the frame edge to edge. Font size is solved by measuring at a known
  // size rather than guessed, which holds for any viewport.
  function fitHappyBirthday(){
    const target = window.innerWidth * 0.96;
    hbStack.querySelectorAll('.hb-line').forEach(el => {
      el.style.fontSize = '100px';
      const w = el.getBoundingClientRect().width;
      if(w > 0) el.style.fontSize = (100 * target / w) + 'px';
    });
  }

  // Two lines sitting behind the number, held at 40% so the age still leads.
  // The glow itself breathes in CSS; this only brings the block in.
  function showHappyBirthday(){
    fitHappyBirthday();
    window.addEventListener('resize', fitHappyBirthday);
    gsap.fromTo(hbStack,
      { opacity:0, scale:0.94 },
      { opacity:0.4, scale:1, duration:1.5, ease:'expo.out' }
    );
  }

  function fireCelebration(){
    if(celebrated) return;
    celebrated = true;
    showHappyBirthday();
  }

  // ---------------- heart particles ----------------

  const hctx = heartCanvas.getContext('2d');

  function sizeHeartCanvas(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    heartCanvas.width = Math.round(window.innerWidth * dpr);
    heartCanvas.height = Math.round(window.innerHeight * dpr);
    heartCanvas.style.width = window.innerWidth + 'px';
    heartCanvas.style.height = window.innerHeight + 'px';
    hctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  sizeHeartCanvas();
  window.addEventListener('resize', sizeHeartCanvas);

  function heartPath(g, cx, top, w, h){
    const left = cx - w/2, right = cx + w/2;
    g.beginPath();
    g.moveTo(cx, top + h*0.3);
    g.bezierCurveTo(cx, top, left, top, left, top + h*0.3);
    g.bezierCurveTo(left, top + h*0.6, cx, top + h*0.78, cx, top + h);
    g.bezierCurveTo(cx, top + h*0.78, right, top + h*0.6, right, top + h*0.3);
    g.bezierCurveTo(right, top, cx, top, cx, top + h*0.3);
    g.closePath();
  }

  // Hearts are pre-rendered once per tint with their glow and gloss baked in;
  // drawing a few hundred of them per frame has to stay a plain drawImage.
  function makeHeartSprite(color){
    const S = 72;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');

    const glow = g.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
    glow.addColorStop(0, color + 'aa');
    glow.addColorStop(0.5, color + '33');
    glow.addColorStop(1, color + '00');
    g.fillStyle = glow;
    g.fillRect(0, 0, S, S);

    g.fillStyle = color;
    heartPath(g, S/2, S*0.20, S*0.60, S*0.58);
    g.fill();

    g.fillStyle = 'rgba(255,255,255,0.55)';
    g.beginPath();
    g.ellipse(S*0.365, S*0.35, S*0.075, S*0.05, -0.6, 0, Math.PI*2);
    g.fill();

    return c;
  }

  const HEART_SPRITES = ['#ffb7ce','#ffc6d8','#ffd4e2','#ffdbe6','#ffe8ef','#f4809f'].map(makeHeartSprite);

  // Rasterise a number at the watermark's own font and read back every filled
  // pixel, giving a point cloud in the shape of the glyphs.
  function glyphPoints(text, rect){
    const scale = Math.min(1, 260 / rect.height);
    const W = Math.max(1, Math.round(rect.width * scale));
    const H = Math.max(1, Math.round(rect.height * scale));

    const c = document.createElement('canvas');
    c.width = W;
    c.height = H;
    const g = c.getContext('2d', { willReadFrequently: true });

    const style = getComputedStyle(watermarkEl);
    const fontSize = parseFloat(style.fontSize) * scale;
    g.font = `${style.fontWeight} ${fontSize}px ${style.fontFamily}`;
    g.textBaseline = 'middle';
    g.textAlign = 'center';
    g.fillStyle = '#ffffff';
    g.fillText(text, W/2, H/2 + fontSize*0.03);

    const data = g.getImageData(0, 0, W, H).data;
    const pts = [];
    for(let y = 0; y < H; y += 3){
      for(let x = 0; x < W; x += 3){
        if(data[(y*W + x)*4 + 3] > 128){
          pts.push({ x: rect.left + x/scale, y: rect.top + y/scale });
        }
      }
    }
    return pts;
  }

  function shuffled(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = (Math.random() * (i+1)) | 0;
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function heartsReveal(){
    if(transitioning || revealed) return;

    const rect = watermarkEl.getBoundingClientRect();
    const from = shuffled(glyphPoints(watermarkEl.textContent, rect));
    const to = shuffled(glyphPoints(String(AGE).padStart(2,'0'), rect));
    if(!from.length || !to.length) return;

    transitioning = true;

    const count = Math.min(to.length, window.innerWidth < 640 ? 460 : 900);
    const baseSize = Math.max(10, Math.min(25, rect.height * 0.045));

    const parts = [];
    for(let i = 0; i < count; i++){
      const a = from[i % from.length];
      const b = to[i];
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      // Bow each path sideways so the swarm swirls into place instead of
      // sliding along a straight line.
      const bow = (Math.random() - 0.5) * Math.min(220, len*0.9 + 60);
      parts.push({
        ax: a.x, ay: a.y,
        bx: b.x, by: b.y,
        cx: (a.x + b.x)/2 + (-dy/len)*bow,
        cy: (a.y + b.y)/2 + (dx/len)*bow - 40 - Math.random()*60,
        delay: Math.random() * 0.42,
        dur: 0.95 + Math.random() * 0.5,
        size: baseSize * (0.6 + Math.random() * 0.85),
        rot: (Math.random() - 0.5) * 1.2,
        spin: (Math.random() - 0.5) * 3.4,
        wob: Math.random() * Math.PI * 2,
        sprite: HEART_SPRITES[(Math.random() * HEART_SPRITES.length) | 0]
      });
    }

    watermarkEl.style.opacity = '0';

    const state = { t: 0, fade: 1, lift: 0 };
    const t0 = performance.now();
    const FORMED = 1.95;

    function draw(){
      hctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      const pulse = (performance.now() - t0) * 0.001;

      for(let i = 0; i < parts.length; i++){
        const p = parts[i];
        let u = (state.t - p.delay) / p.dur;
        if(u <= 0) continue;
        if(u > 1) u = 1;

        const e = 1 - Math.pow(1 - u, 3);
        const inv = 1 - e;
        const x = inv*inv*p.ax + 2*inv*e*p.cx + e*e*p.bx;
        const y = inv*inv*p.ay + 2*inv*e*p.cy + e*e*p.by - state.lift;

        // Pop in on departure, then a soft beat once settled.
        const grow = Math.min(1, u * 4);
        const beat = u >= 1 ? 1 + Math.sin(pulse*6 + p.wob) * 0.07 : 1;
        const size = p.size * grow * beat;
        if(size <= 0.2 || state.fade <= 0.01) continue;

        hctx.globalAlpha = state.fade;
        hctx.save();
        hctx.translate(x, y);
        hctx.rotate(p.rot + p.spin*e);
        hctx.drawImage(p.sprite, -size/2, -size/2, size, size);
        hctx.restore();
      }
      hctx.globalAlpha = 1;
    }

    function revealNumber(){
      revealed = true;
      watermarkEl.textContent = String(AGE).padStart(2,'0');
      watermarkEl.classList.add('is-revealed');
      fireCelebration();

      gsap.fromTo(revealFlash,
        {scale:0.2, opacity:0.95},
        {scale:7.5, opacity:0, duration:1.3, ease:'power2.out'}
      );

      // The number blooms out of the settled hearts as they let go of it.
      gsap.fromTo(watermarkEl,
        { opacity:0, scale:0.86, filter:'blur(18px)', color:'#fff' },
        { opacity:1, scale:1, filter:'blur(0px)', duration:1.2, ease:'expo.out' }
      );
      gsap.fromTo(watermarkEl,
        { textShadow:'0 0 0px rgba(255,160,190,0)' },
        {
          textShadow:'0 0 70px rgba(255,175,200,0.5)',
          duration:0.75,
          ease:'sine.out',
          yoyo:true,
          repeat:1,
          delay:0.15,
          onComplete: () => { watermarkEl.style.textShadow = 'none'; }
        }
      );

      triggerBtn.style.pointerEvents = 'none';
      triggerBtn.setAttribute('aria-disabled', 'true');
    }

    gsap.timeline({
        onComplete: () => {
          hctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
          transitioning = false;
        }
      })
      .to(state, { t: FORMED, duration: FORMED, ease: 'none', onUpdate: draw }, 0)
      .call(revealNumber, null, FORMED)
      .to(state, { fade: 0, lift: 70, duration: 0.9, ease: 'power2.in', onUpdate: draw }, FORMED);
  }

  triggerBtn.addEventListener('click', heartsReveal);



  //play music on button click
  triggerBtn.addEventListener('click', () => {
  if (bgMusic.paused) {
    bgMusic.play().catch(() => {}); // catch autoplay-policy rejection silently
    musicPlayer.classList.add('is-visible', 'is-playing');
  }
}, { once: true }); // only trigger the first press/burn

  // ---------------- intro: odometer-style roll into the number, then zoom through ----------------
  const introNum = document.getElementById('introNum');
  introNum.textContent = '';

  const finalDigits = String(DISPLAY_AGE).split('');
  const cols = finalDigits.map((chr, idx) => {
    const target = parseInt(chr, 10);
    const loops = 1 + idx; // each column further right spins through more full loops
    const colWrap = document.createElement('div');
    colWrap.className = 'od-col';
    const strip = document.createElement('div');
    strip.className = 'od-strip';
    for(let L = 0; L <= loops; L++){
      for(let d = 0; d < 10; d++){
        const s = document.createElement('span');
        s.className = 'od-digit';
        s.textContent = d;
        strip.appendChild(s);
      }
    }
    colWrap.appendChild(strip);
    introNum.appendChild(colWrap);
    return {strip, target, loops};
  });

  // measure one rendered digit's height so the roll distance is exact, not guessed
  const digitH = cols.length ? cols[0].strip.querySelector('.od-digit').getBoundingClientRect().height : 0;

  const tl = gsap.timeline();

  cols.forEach((col, idx) => {
    const finalIndex = col.loops * 10 + col.target;
    const finalY = -finalIndex * digitH;
    const dur = 1.05 + idx * 0.34;
    let prevY = 0;
    tl.to(col.strip, {
      y: finalY,
      duration: dur,
      ease: 'back.out(1.3)',
      onUpdate: function(){
        const curY = gsap.getProperty(col.strip, 'y');
        const vel = Math.abs(curY - prevY);
        prevY = curY;
        const blurAmt = Math.min(6, vel * 0.55);
        col.strip.style.filter = blurAmt > 0.15 ? `blur(${blurAmt.toFixed(2)}px)` : 'blur(0px)';
      },
      onComplete: () => { col.strip.style.filter = 'blur(0px)'; }
    }, 0);
  });

  tl.to({}, {duration: 0.35}) // brief hold on the final number once every column has landed
    .to('#introNum', {
      scale: 24,
      opacity: 0,
      filter: 'blur(20px)',
      duration: 0.9,
      ease: 'power4.in'
    }, '>')
    .to('.intro-label', {opacity: 0, duration: 0.35, ease: 'power2.in'}, '<')
    .set('#hero', {opacity: 1}, '-=0.4')
    .set('#intro', {display: 'none'})
    .fromTo('.corner', {opacity:0, y:6}, {opacity:1, y:0, duration:0.6, stagger:0.1})
    .to('#pressPrompt', {opacity:1, duration:0.7, ease:'power2.out'}, '<0.2')
    .set('#pressPrompt', {pointerEvents:'auto'})
    .call(() => {
      // reveal the mini player once the intro sequence has resolved
      document.getElementById('musicPlayer').classList.add('is-visible');
    }, null, '<');

  // ---------------- live readout tick ----------------
  setInterval(() => {
    const p = computeParts();
    document.getElementById('liveReadout').textContent = readout(p);
  }, 1000);

  // ---------------- spotify-style mini player controls ----------------
  // Background music sits under the animation, not over it.
  const MUSIC_VOLUME = 0.2;   // a third, then 20% quieter again

  const bgMusic = document.getElementById('bgMusic');
  bgMusic.volume = MUSIC_VOLUME;
  const musicPlayer = document.getElementById('musicPlayer');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const seek = document.getElementById('seek');
  const curTimeEl = document.getElementById('curTime');
  const durTimeEl = document.getElementById('durTime');

  function formatTime(sec){
    if(!isFinite(sec) || isNaN(sec)) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${String(s).padStart(2,'0')}`;
  }

  let seeking = false;

  playPauseBtn.addEventListener('click', () => {
    if(bgMusic.paused){
      bgMusic.play().catch(() => {});
    } else {
      bgMusic.pause();
    }
  });

  bgMusic.addEventListener('play', () => musicPlayer.classList.add('is-playing'));
  bgMusic.addEventListener('pause', () => musicPlayer.classList.remove('is-playing'));

  bgMusic.addEventListener('loadedmetadata', () => {
    durTimeEl.textContent = formatTime(bgMusic.duration);
  });

  bgMusic.addEventListener('timeupdate', () => {
    if(seeking) return;
    curTimeEl.textContent = formatTime(bgMusic.currentTime);
    const pct = bgMusic.duration ? (bgMusic.currentTime / bgMusic.duration) * 100 : 0;
    seek.value = pct;
    seek.style.setProperty('--progress', pct + '%');
  });

  seek.addEventListener('input', () => {
    seeking = true;
    seek.style.setProperty('--progress', seek.value + '%');
    curTimeEl.textContent = formatTime((seek.value / 100) * (bgMusic.duration || 0));
  });

  seek.addEventListener('change', () => {
    if(bgMusic.duration){
      bgMusic.currentTime = (seek.value / 100) * bgMusic.duration;
    }
    seeking = false;
  });

  // browsers block un-prompted audio autoplay - attempt it, and otherwise
  // let the mini player's play button be the first user gesture that starts it
  bgMusic.play().catch(() => {});

  // ---------------- player art: crossfade through the cover photos ----------------
  // Listed rather than built from an index: the files are not a clean 1..n run
  // (there is a `girl.jpeg` with no number, and no `girl1`), so counting would
  // ask for names that do not exist.
  const PIPI_ART = [
    '/ref/girl.jpeg',
    '/ref/girl2.jpeg',
    '/ref/girl3.jpeg',
    '/ref/girl4.jpeg',
    '/ref/girl5.jpeg',
    '/ref/girl6.jpeg',
    '/ref/girl7.jpeg',
    '/ref/girl8.jpeg',
    '/ref/girl9.jpeg',
    '/ref/girl10.jpeg',
    '/ref/girl11.jpeg',
    '/ref/girl12.jpeg',
    '/ref/girl13.jpeg',
    '/ref/girl14.jpeg',
  ];
  const artA = document.getElementById('artA');
  const artB = document.getElementById('artB');
  let pipiIndex = 0;        // artA starts on PIPI_ART[0]
  let showingA = true;

  setInterval(() => {
    pipiIndex = (pipiIndex + 1) % PIPI_ART.length;
    const nextSrc = PIPI_ART[pipiIndex];
    const incoming = showingA ? artB : artA;
    const outgoing = showingA ? artA : artB;
    incoming.src = nextSrc;
    incoming.classList.add('is-active');
    outgoing.classList.remove('is-active');
    showingA = !showingA;
  }, 3200);
</script>
